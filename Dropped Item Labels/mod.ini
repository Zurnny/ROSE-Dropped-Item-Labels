Description=Options > UI > Dropped Items: a background slider for the names of dropped items (clear to solid), next to the game's own "Show dropped item name" and "Show item pickup status", which move there from the Game tab.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Options lists the new Craft Max add-on; the Steampunk look uses the sharper 2x Steampunk art.
